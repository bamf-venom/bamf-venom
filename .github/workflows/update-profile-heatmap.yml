name: Refresh profile contribution graph

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/update_profile_heatmap.py"
      - ".github/workflows/update-profile-heatmap.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch contributions and render SVG
        run: python scripts/update_profile_heatmap.py
      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-contributions.json profile-heatmap.svg
          if git diff --cached --quiet; then
            echo "Contribution graph is already current."
            exit 0
          fi
          git commit -m "chore: refresh profile contribution graph [skip ci]"
          git push
